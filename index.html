<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital Appointment System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>🏥 Hospital Appointment System</h1>
      <p>Simple and easy online doctor appointment booking</p>
    </header>

    <!-- Booking Form Section -->
    <section class="card">
      <h2>Book an Appointment</h2>
      
      <!-- Feedback Message -->
      <div id="message" class="message"></div>

      <form id="appointmentForm">
        <div class="form-group">
          <label for="patientName">Patient Name *</label>
          <input type="text" id="patientName" placeholder="Enter patient full name" required>
        </div>

        <div class="form-group">
          <label for="patientPhone">Phone Number *</label>
          <input type="tel" id="patientPhone" placeholder="Enter phone number" required>
        </div>

        <div class="form-group">
          <label for="doctorSelect">Select Doctor *</label>
          <select id="doctorSelect" required>
            <option value="">-- Choose a Doctor --</option>
            <option value="Dr. Sharma (General Physician)">Dr. Sharma (General Physician)</option>
            <option value="Dr. Priya Patel (Cardiologist)">Dr. Priya Patel (Cardiologist)</option>
            <option value="Dr. Rajesh Kumar (Pediatrician)">Dr. Rajesh Kumar (Pediatrician)</option>
            <option value="Dr. Ananya Iyer (Dermatologist)">Dr. Ananya Iyer (Dermatologist)</option>
            <option value="Dr. Vikram Singh (Orthopedic)">Dr. Vikram Singh (Orthopedic)</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="appointmentDate">Appointment Date *</label>
            <input type="date" id="appointmentDate" required>
          </div>

          <div class="form-group">
            <label for="appointmentTime">Time Slot *</label>
            <select id="appointmentTime" required>
              <option value="">-- Select Time Slot --</option>
              <option value="09:00 AM">09:00 AM</option>
              <option value="10:00 AM">10:00 AM</option>
              <option value="11:30 AM">11:30 AM</option>
              <option value="02:00 PM">02:00 PM</option>
              <option value="03:30 PM">03:30 PM</option>
              <option value="05:00 PM">05:00 PM</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="symptoms">Symptoms / Reason (Optional)</label>
          <textarea id="symptoms" rows="2" placeholder="Briefly describe symptoms or reason for visit..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Book Appointment</button>
      </form>
    </section>

    <!-- Appointments Table Section -->
    <section class="card">
      <div class="table-header">
        <h2>Scheduled Appointments</h2>
        <input type="text" id="searchInput" placeholder="Search by patient or doctor...">
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Patient Name</th>
              <th>Phone</th>
              <th>Doctor</th>
              <th>Date</th>
              <th>Time</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="appointmentTableBody">
            <!-- Rows rendered dynamically by script.js -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- Footer -->
    <footer>
      <p>&copy; 2026 Hospital Appointment System. All rights reserved.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
